# SwiftstvWeb stream proxy — Nginx site (Ubuntu/Debian)
# Place at /etc/nginx/sites-available/proxy.swiftstv.com then:
#   sudo ln -s /etc/nginx/sites-available/proxy.swiftstv.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS via Certbot (obtains + auto-renews):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d proxy.swiftstv.com
# Repeat for any extra domains. Certbot rewrites the server block below,
# adding its TLS lines and a redirect-to-https block.

# --- 80: redirect to HTTPS (Certbot usually manages this too) ------------
server {
    listen 80;
    listen [::]:80;
    server_name proxy.swiftstv.com;

    # Let Certbot do the redirect automatically, but a bare one is a safe fallback:
    return 301 https://$host$request_uri;
}

# --- 443: HTTPS reverse proxy to the PM2 Express proxy --------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name proxy.swiftstv.com;

    # Certbot fills these in (run `sudo certbot --nginx -d proxy.swiftstv.com`).
    # Until then you can temporarily comment the ssl_* lines and use the :80 block.
    ssl_certificate     /etc/letsencrypt/live/proxy.swiftstv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.swiftstv.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Streaming-friendly (HLS segments / VOD mp4). Avoid the default buffering
    # that would try to read the whole body before sending.
    proxy_request_buffering off;
    # Send headers+body as they arrive (progressive streaming).
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_max_body_size 0;
    # Leave the OS to push bytes out immediately (no TCP aggregation delay).
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    # Keep per-connection write buffers modest so a large VOD body never leaks
    # memory; with proxy_buffering off Nginx relays chunks as they stream.
    output_buffers 1 128k;

    # The Express proxy path.
    location /stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep upstream connections alive (reduces TCP handshakes per segment).
        proxy_set_header Connection "";

        # 206 Partial Content must pass untouched for <video> seeking.
        proxy_ignore_headers "";

        # Disable proxy buffering for byte-range responses.
        proxy_buffering off;
        # Never spill a large response body to a temp file (would delay chunks);
        # let streaming go straight through.
        proxy_max_temp_file_size 0;
        # Small buffers for the 206 headers; body flows without buffering.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;

        # Let Range requests through and expose response ranges to the browser.
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers * always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
    }

    # Health check used by PM2 load-aliases / monitoring.
    location /healthz {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # Everything else → 404 JSON (the proxy handles it).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
